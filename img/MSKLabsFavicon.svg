<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <style>
    .p { fill: #000000; }
    @media (prefers-color-scheme: dark) {
      .p { fill: #FFFFFF; }
    }
  </style>
  <g class="p">
    <!-- ÜST SATIR: M S K (y: 1..7) -->
    <!-- M (x: 0..4) -->
    <rect x="0" y="1" width="1" height="7"/>
    <rect x="1" y="2" width="1" height="2"/>
    <rect x="2" y="3" width="1" height="2"/>
    <rect x="3" y="2" width="1" height="2"/>
    <rect x="4" y="1" width="1" height="7"/>

    <!-- S (x: 6..9) -->
    <rect x="7" y="1" width="3" height="1"/>
    <rect x="6" y="2" width="1" height="2"/>
    <rect x="7" y="4" width="2" height="1"/>
    <rect x="9" y="5" width="1" height="2"/>
    <rect x="6" y="7" width="3" height="1"/>

    <!-- K (x: 11..14) -->
    <rect x="11" y="1" width="1" height="7"/>
    <rect x="14" y="1" width="1" height="1"/>
    <rect x="13" y="2" width="1" height="1"/>
    <rect x="12" y="3" width="1" height="2"/>
    <rect x="13" y="5" width="1" height="1"/>
    <rect x="14" y="6" width="1" height="2"/>

    <!-- ALT SATIR: L A B S (y: 9..14) -->
    <!-- L (x: 0..2) -->
    <rect x="0" y="9" width="1" height="6"/>
    <rect x="1" y="14" width="2" height="1"/>

    <!-- A (x: 4..6) -->
    <rect x="5" y="9" width="1" height="1"/>
    <rect x="4" y="10" width="1" height="5"/>
    <rect x="6" y="10" width="1" height="5"/>
    <rect x="5" y="12" width="1" height="1"/>

    <!-- B (x: 8..10) -->
    <rect x="8" y="9" width="1" height="6"/>
    <rect x="9" y="9" width="1" height="1"/>
    <rect x="10" y="10" width="1" height="1"/>
    <rect x="9" y="11" width="1" height="1"/>
    <rect x="10" y="12" width="1" height="2"/>
    <rect x="9" y="14" width="1" height="1"/>

    <!-- S (x: 12..14) -->
    <rect x="13" y="9" width="2" height="1"/>
    <rect x="12" y="10" width="1" height="1"/>
    <rect x="13" y="11" width="1" height="1"/>
    <rect x="14" y="12" width="1" height="2"/>
    <rect x="12" y="14" width="2" height="1"/>
  </g>
</svg>
